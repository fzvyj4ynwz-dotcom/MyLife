<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>MyLife</title><style>body{font:17px -apple-system,sans-serif;background:#eef2fa;color:#17243e;max-width:600px;margin:auto;padding:24px}section{background:white;border-radius:22px;padding:18px;margin:16px 0}input,select,button{font:inherit;padding:12px;border:0;border-radius:12px;margin:4px;max-width:90%}input,select{background:#e4e9f3;color:#17243e}button{background:#405cf5;color:white}article{padding:10px;border-bottom:1px solid #8884;display:flex;align-items:center;gap:8px}article span{flex:1;overflow-wrap:anywhere}progress{width:100%}@media(prefers-color-scheme:dark){body{background:#10182b;color:white}section{background:#202b42}}</style><h1>MyLife</h1><p>Il tuo piano giornaliero</p><section><input type="date" id="day"><select id="tab"><option>Attività</option><option>Calendario</option><option>Routine</option><option>Obiettivi</option></select><p id="status"></p><progress id="bar" max="1"></progress><div id="list"></div></section><section><form id="form"><input id="task" required placeholder="Nuovo impegno"><input type="time" id="time"><select id="priority"><option>Normale</option><option>Alta</option><option>Bassa</option></select><button>Aggiungi</button></form></section><small>Dati salvati sul dispositivo.</small><script>const $=x=>document.getElementById(x);let d=new Date();$('day').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');let a=JSON.parse(localStorage.getItem('mylife')||'[]');function save(){localStorage.setItem('mylife',JSON.stringify(a));render()}function render(){let t=$('tab').value,k=$('day').value,l=a.filter(x=>x.tab===t&&(t==='Routine'||t==='Obiettivi'||x.day===k)).sort((a,b)=>a.time.localeCompare(b.time));let done=x=>t==='Routine'?!!x.days[k]:x.done;let n=l.filter(done).length;$('status').textContent=n+' di '+l.length+' completati';$('bar').value=l.length?n/l.length:0;$('list').replaceChildren();for(let x of l){let r=document.createElement('article'),c=document.createElement('input'),s=document.createElement('span'),b=document.createElement('button');c.type='checkbox';c.checked=done(x);c.onchange=()=>{if(t==='Routine')x.days[k]=c.checked;else x.done=c.checked;save()};s.textContent=x.time+' '+x.name+' · '+x.priority;if(done(x))s.style.textDecoration='line-through';b.textContent='×';b.onclick=()=>{if(confirm('Eliminare?')){a=a.filter(y=>y!==x);save()}};r.append(c,s,b);$('list').append(r)}}$('tab').onchange=$('day').onchange=render;$('form').onsubmit=e=>{e.preventDefault();a.push({name:$('task').value,time:$('time').value,priority:$('priority').value,day:$('day').value,tab:$('tab').value,done:false,days:{}});$('form').reset();save()};render()</script></html>
