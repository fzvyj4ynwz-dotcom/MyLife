  <dialog id="editor-dialog"><div class="dialog-inner"><header><div><div class="eyebrow">UNISTUDIO</div><h2 id="dialog-title">Nuovo elemento</h2></div><button class="icon-btn" id="close-dialog" type="button" aria-label="Chiudi">✕</button></header><form id="editor-form"></form></div></dialog>
  <input type="file" accept="application/json,.json" id="import-file" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>(() => {
  'use strict';
  const KEY = 'unistudio_data_v1';
  const DAYS = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const SHORT_DAYS = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  const COLORS = ['#8667dc','#e08d95','#64a7a0','#e3a466','#7594d7','#af86c6'];
  const $ = s => document.querySelector(s);
  const emptyState = () => ({courses:[],lessons:[],tasks:[],exams:[],notes:[],sessions:[],notifications:false});
  let state;
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    state = saved && typeof saved === 'object' ? {...emptyState(), ...saved} : emptyState();
    for (const key of ['courses','lessons','tasks','exams','notes','sessions']) if (!Array.isArray(state[key])) state[key] = [];
  } catch { state = emptyState(); }
  let page = 'home', weekOffset = 0, taskFilter = 'all', noteSearch = '';
  let focus = {mode:'work',left:25*60,running:false,endAt:0};
  let toastTimeout;
  const uid = () => (globalThis.crypto?.randomUUID?.() || `id_${Date.now()}_${Math.random().toString(36).slice(2)}`);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const attr = esc;
  const pad = n => String(n).padStart(2,'0');
  const localDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const atDate = s => {const [y,m,d] = (s || localDate(new Date())).split('-').map(Number);return new Date(y,m-1,d)};
  const plusDays = (date,n) => {const d= new Date(date);d.setDate(d.getDate()+n);return d;};
  const today = () => localDate(new Date());
  const fmtDate = (s,options={day:'numeric',month:'short'}) => s ? atDate(s).toLocaleDateString('it-IT',options) : 'Senza data';
  const diffDays = s => Math.round((atDate(s).getTime()-atDate(today()).getTime())/86400000);
  const dayName = n => DAYS[Number(n)] || DAYS[0];
  const course = id => state.courses.find(c=>c.id===id);
  const courseName = id => course(id)?.name || 'Generale';
  const courseColor = id => course(id)?.color || COLORS[0];
  const safeColor = c => /^#[a-fA-F0-9]{6}$/.test(c||'') ? c : COLORS[0];
  const sortDateTime = (a,b) => `${a.date||''} ${a.time||''}`.localeCompare(`${b.date||''} ${b.time||''}`);
  const save = () => {try {localStorage.setItem(KEY,JSON.stringify(state));} catch {toast('Spazio esaurito. Esporta un backup e libera spazio.');}};
  function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),3100);}
  function empty(message, action='', label='Aggiungi ora'){
    return `<div class="empty"><span class="empty-icon">✦</span>${esc(message)}${action?`<div><button class="light-btn small-btn" data-action="${action}">＋ ${esc(label)}</button></div>`:''}</div>`;
  }
  function head(title,action='',label='Aggiungi',description=''){
    return `<div class="section-heading"><div><h2>${title}</h2>${description?`<p>${description}</p>`:''}</div>${action?`<button class="light-btn small-btn" data-action="${action}">＋ ${label}</button>`:''}</div>`;
  }
  function taskCount(){return state.tasks.filter(t=>!t.done).length;}
  function nextExam(){return [...state.exams].filter(e=>e.date>=today()&&!e.grade).sort(sortDateTime)[0];}
  function eventsOf(date){
    const d=atDate(date),wd=d.getDay();
    const ev = [];
    for(const l of state.lessons) if(Number(l.weekday)===wd){ev.push({kind:'lesson',id:l.id,title:courseName(l.courseId),date,time:l.start||'00:00',end:l.end||'',detail:l.room||'',color:courseColor(l.courseId)});}
    for(const t of state.tasks) if(t.date===date) ev.push({kind:'task',id:t.id,title:t.title,date,time:t.time||'09:00',detail:t.done?'Completato':'Da fare',done:t.done});
    for(const e of state.exams) if(e.date===date) ev.push({kind:'exam',id:e.id,title:e.title,date,time:e.time||'09:00',detail:e.room||'Esame'});
    return ev.sort((a,b)=>a.time.localeCompare(b.time));
  }
  function stat(label,value,icon,sub){return `<div class="stat-card"><div class="stat-label"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><div class="stat-sub">${sub}</div></div>`;}
  function eventRow(e){return `<div class="item-row"><span class="time-pill">${esc(e.time)}${e.end?`<br><span style="font-weight:500;font-size:9px">${esc(e.end)}</span>`:''}</span><div class="item-main"><div class="item-title">${esc(e.title)}</div><div class="item-sub">${esc(e.detail|| ({lesson:'Lezione',exam:'Esame',task:'Promemoria'}[e.kind]))}</div></div><span class="chip">${{lesson:'Lezione',exam:'Esame',task:'Da fare'}[e.kind]}</span></div>`;}
  function hero(){
    const h=new Date().getHours();const greeting=h<12?'Buongiorno':h<18?'Buon pomeriggio':'Buonasera';
    const active=state.courses.length>0;
    return `<section class="hero"><div><div class="hero-kicker">IL TUO SPAZIO, IL TUO RITMO</div><h2>${greeting}! ${active?'Pronta a dare il meglio?':'Benvenuta in UniStudio.'}</h2><p>${active?'Le tue lezioni, i tuoi traguardi e tutti i piccoli passi verso la laurea.':'Inizia aggiungendo le tue materie: il resto sarà più semplice, un giorno alla volta.'}</p><button class="plain-btn" style="margin-top:18px;background:white;color:#6f53c9" data-action="${active?'add-task':'add-course'}">＋ ${active?'Organizza una cosa da fare':'Aggiungi la prima materia'}</button></div><div class="hero-art" aria-hidden="true">✎</div></section>`;
  }
  function renderHome(){
    const todayEvents=eventsOf(today());
    const pending=[...state.tasks].filter(t=>!t.done).sort(sortDateTime).slice(0,5);
    const upcoming=nextExam();
    const weekLessons=state.lessons.length;
    return `${hero()}<div class="stats-grid">${stat('Materie',state.courses.length,'▤','In questo semestre')}${stat('Lezioni / settimana',weekLessons,'▦','Orario ricorrente')}${stat('Da completare',taskCount(),'☑','Promemoria attivi')}${stat('Esami in arrivo',state.exams.filter(e=>e.date>=today()&&!e.grade).length,'✧','Ancora da sostenere')}</div>
      <div class="two-col"><section>${head('La giornata di oggi','add-lesson','Nuova lezione')}<div class="surface surface-pad">${todayEvents.length?todayEvents.map(eventRow).join(''):empty('Nessuna lezione o scadenza oggi. Goditi il tempo per ripassare!', 'add-task','Crea promemoria')}</div></section>
      <section>${head('Prossimi impegni','add-task','Aggiungi')}<div class="surface surface-pad">${pending.length?pending.map(t=>`<div class="item-row"><button class="check-btn" aria-label="Segna come completato" data-action="toggle-task" data-id="${attr(t.id)}"></button><div class="item-main"><div class="item-title">${esc(t.title)}</div><div class="item-sub">${esc(courseName(t.courseId))} · ${fmtDate(t.date)}</div></div>${t.date&&diffDays(t.date)<0?'<span class="status-chip urgent">Scaduto</span>':''}</div>`).join(''):empty('Nessuna attività in sospeso.','add-task','Crea promemoria')}</div></section></div>
      <div class="two-col"><section>${head('Il prossimo esame','add-exam','Nuovo esame')}<div class="surface surface-pad">${upcoming?`<div class="item-row" style="border:0"><div class="time-pill">✧</div><div class="item-main"><div class="item-title">${esc(upcoming.title)}</div><div class="item-sub">${fmtDate(upcoming.date,{day:'numeric',month:'long',year:'numeric'})}${upcoming.time?' alle '+esc(upcoming.time):''}</div></div><span class="status-chip ${diffDays(upcoming.date)<7?'urgent':''}">${diffDays(upcoming.date)===0?'Oggi':`Tra ${diffDays(upcoming.date)} giorni`}</span></div>`:empty('Nessun esame programmato.','add-exam','Aggiungi esame')}</div></section>
      <section>${head('Il tuo tempo di studio','go-focus','Apri Focus')}<div class="surface surface-pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="eyebrow">POMODORO</div><div style="font-size:27px;font-weight:800;margin:12px 0 4px">25:00</div><div class="item-sub">Concentrati, poi una pausa</div></div><button class="light-btn" data-action="go-focus">Inizia →</button></div></div></section></div>`;
  }
  function renderAgenda(){
    const now=atDate(today()),monday=plusDays(now,-((now.getDay()+6)%7)+7*weekOffset);
    const span=Array.from({length:7},(_,i)=>plusDays(monday,i));
    const title=`${fmtDate(localDate(span[0]),{day:'numeric',month:'short'})} – ${fmtDate(localDate(span[6]),{day:'numeric',month:'short',year:'numeric'})}`;
    return `<div class="toolbar"><div class="toolbar-left"><button class="plain-btn small-btn" data-action="week-back">←</button><button class="plain-btn small-btn" data-action="week-today">Oggi</button><button class="plain-btn small-btn" data-action="week-next">→</button><strong style="font-size:13px;margin-left:5px">${title}</strong></div><div class="toolbar-right"><button class="light-btn small-btn" data-action="export-ics">↓ Aggiungi a Calendario</button><button class="primary-btn small-btn" data-action="add-lesson">＋ Lezione</button></div></div>
      <div class="weekday-grid">${span.map(d=>{const date=localDate(d),ev=eventsOf(date);return `<div class="day-column ${date===today()?'today':''}"><div class="day-heading"><span>${SHORT_DAYS[d.getDay()]}</span><strong>${d.getDate()}</strong></div>${ev.length?ev.map(e=>`<button class="calendar-event ${e.kind==='task'?'task':e.kind==='exam'?'exam':''}" style="--event:${e.color||''};--event-bg:${e.color?e.color+'18':''}" data-action="edit-${e.kind==='lesson'?'lesson':e.kind==='exam'?'exam':'task'}" data-id="${attr(e.id)}"><small>${esc(e.time)}</small><strong>${esc(e.title)}</strong></button>`).join(''):'<div class="no-day">—</div>'}</div>`}).join('')}</div>
      ${head('Legenda')}<div class="surface surface-pad" style="display:flex;gap:13px;flex-wrap:wrap"><span class="chip">Lezioni</span><span class="status-chip" style="background:#fff8ed;color:#b58148">Promemoria</span><span class="status-chip urgent">Esami</span><span class="item-sub">Tocca un evento per modificarlo. Le lezioni si ripetono ogni settimana.</span></div>`;
  }
  function renderLessons(){
    const sorted=[...state.lessons].sort((a,b)=>((Number(a.weekday)+6)%7)-((Number(b.weekday)+6)%7)||String(a.start).localeCompare(String(b.start)));
    return `<div class="toolbar"><div class="toolbar-left"><span class="muted" style="font-size:12px">Organizza materie e orario settimanale</span></div><div class="toolbar-right"><button class="light-btn" data-action="add-course">＋ Materia</button><button class="primary-btn" data-action="add-lesson">＋ Lezione</button></div></div>
      ${head('Le mie materie')}<div class="cards-grid">${state.courses.length?state.courses.map(c=>`<div class="course-card" style="--course:${safeColor(c.color)}"><h3>${esc(c.name)}</h3><p>${c.professor?'Docente: '+esc(c.professor):'Aggiungi un docente dalle impostazioni della materia'}</p><div class="card-bottom"><span class="small-muted">${state.lessons.filter(l=>l.courseId===c.id).length} lezioni</span><div class="action-cluster"><button class="text-btn" data-action="edit-course" data-id="${attr(c.id)}">Modifica</button><button class="text-btn danger" data-action="delete-course" data-id="${attr(c.id)}">Elimina</button></div></div></div>`).join(''):empty('Non hai ancora aggiunto materie.','add-course','Crea la prima materia')}</div>
      ${head('Orario settimanale')}<div class="surface surface-pad">${sorted.length?sorted.map(l=>`<div class="item-row"><span class="time-pill">${SHORT_DAYS[Number(l.weekday)]}<br>${esc(l.start)}</span><div class="item-main"><div class="item-title">${esc(courseName(l.courseId))}</div><div class="item-sub">${esc(l.start)}–${esc(l.end)}${l.room?' · '+esc(l.room):''}</div></div><div class="action-cluster"><button class="text-btn" data-action="edit-lesson" data-id="${attr(l.id)}">Modifica</button><button class="text-btn danger" data-action="delete-lesson" data-id="${attr(l.id)}">Elimina</button></div></div>`).join(''):empty('Aggiungi le lezioni che si ripetono ogni settimana.','add-lesson','Aggiungi lezione')}</div>`;
  }
  function renderTasks(){
    const tasks=[...state.tasks].filter(t=>taskFilter==='all'||(taskFilter==='open'?!t.done:t.done)).sort((a,b)=>Number(a.done)-Number(b.done)||sortDateTime(a,b));
    return `<div class="toolbar"><div class="toolbar-left"><select class="select-input" id="tasks-filter" aria-label="Filtra promemoria"><option value="all" ${taskFilter==='all'?'selected':''}>Tutti</option><option value="open" ${taskFilter==='open'?'selected':''}>Da completare</option><option value="done" ${taskFilter==='done'?'selected':''}>Completati</option></select><span class="muted" style="font-size:11px">${taskCount()} ancora da fare</span></div><button class="primary-btn" data-action="add-task">＋ Nuovo promemoria</button></div>
      <div class="list-stack">${tasks.length?tasks.map(t=>`<div class="list-card ${t.done?'is-done':''}"><button class="check-btn ${t.done?'checked':''}" aria-label="${t.done?'Riattiva':'Completa'} promemoria" data-action="toggle-task" data-id="${attr(t.id)}">${t.done?'✓':''}</button><span class="priority-dot ${esc(t.priority||'medium')}"></span><div class="grow"><strong style="${t.done?'text-decoration:line-through':''}">${esc(t.title)}</strong><small>${esc(courseName(t.courseId))}${t.description?' · '+esc(t.description):''}</small></div>${t.date?`<span class="tag-date ${!t.done&&diffDays(t.date)<0?'late':''}">${fmtDate(t.date)}${t.time?' · '+esc(t.time):''}</span>`:''}<div class="action-cluster"><button class="text-btn" data-action="edit-task" data-id="${attr(t.id)}" aria-label="Modifica">✎</button><button class="text-btn danger" data-action="delete-task" data-id="${attr(t.id)}" aria-label="Elimina">✕</button></div></div>`).join(''):empty('Nessun promemoria in questa sezione.','add-task','Aggiungi promemoria')}</div>`;
  }
  function renderExams(){
    const completed=state.exams.filter(e=>Number(e.grade)>=18&&Number(e.grade)<=30);
    const credits=completed.reduce((s,e)=>s+(Number(e.credits)||1),0);
    const weighted=credits? (completed.reduce((s,e)=>s+Number(e.grade)*(Number(e.credits)||1),0)/credits).toFixed(2):'—';
    const upcoming=[...state.exams].sort(sortDateTime);
    return `<div class="toolbar"><span class="muted" style="font-size:12px">Pianifica i tuoi traguardi universitari</span><button class="primary-btn" data-action="add-exam">＋ Nuovo esame</button></div><div class="stats-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${stat('Esami totali',state.exams.length,'✧','Programmati')}${stat('Superati',completed.length,'✓','Con voto inserito')}${stat('Media ponderata',weighted,'★','In trentesimi')}</div>
      ${head('Calendario esami')}<div class="cards-grid">${upcoming.length?upcoming.map(e=>{const days=diffDays(e.date),passed=Number(e.grade)>=18;return `<div class="exam-card"><div class="big-date">${fmtDate(e.date,{day:'numeric',month:'long',year:'numeric'})}</div><h3>${esc(e.title)}</h3><p>${esc(courseName(e.courseId))}${e.room?' · '+esc(e.room):''}${e.time?' · '+esc(e.time):''}</p><div class="card-bottom"><span class="exam-count ${passed?'good':''}">${passed?'Voto: '+esc(e.grade)+'/30':days<0?'Data trascorsa':days===0?'Oggi':'Tra '+days+' giorni'}</span><div class="action-cluster"><button class="text-btn" data-action="edit-exam" data-id="${attr(e.id)}">Modifica</button><button class="text-btn danger" data-action="delete-exam" data-id="${attr(e.id)}">✕</button></div></div></div>`}).join(''):empty('Non ci sono ancora esami registrati.','add-exam','Aggiungi esame')}</div>`;
  }
  function noteCards(){
    const q=noteSearch.trim().toLocaleLowerCase('it');
    return [...state.notes].filter(n=>!q||`${n.title} ${n.content} ${courseName(n.courseId)}`.toLocaleLowerCase('it').includes(q)).sort((a,b)=>(b.updated||0)-(a.updated||0)).map(n=>`<article class="note-card"><div class="eyebrow">${esc(courseName(n.courseId))}</div><h3 style="margin-top:13px">${esc(n.title)}</h3><p class="note-preview">${esc(n.content.slice(0,220))}${n.content.length>220?'…':''}</p><div class="card-bottom"><span class="note-date">${new Date(n.updated||Date.now()).toLocaleDateString('it-IT')}</span><div class="action-cluster"><button class="text-btn" data-action="edit-note" data-id="${attr(n.id)}">Apri</button><button class="text-btn danger" data-action="delete-note" data-id="${attr(n.id)}">✕</button></div></div></article>`).join('') || empty('Nessun appunto trovato.','add-note','Scrivi un appunto');
  }
  function renderNotes(){return `<div class="toolbar"><div class="toolbar-left"><input id="note-search" class="search-input" placeholder="⌕ Cerca negli appunti..." aria-label="Cerca appunti" value="${attr(noteSearch)}"></div><button class="primary-btn" data-action="add-note">＋ Nuovo appunto</button></div><div id="notes-grid" class="cards-grid">${noteCards()}</div>`;}
  function renderFocus(){
    const doneToday=state.sessions.filter(s=>s.date===today()).length;
    return `<div class="focus-layout"><section class="surface focus-main"><div class="eyebrow">TEMPO PER TE E PER I TUOI OBIETTIVI</div><h2 style="font-size:20px;margin:9px 0 23px">Una cosa alla volta.</h2><div class="timer-mode"><button data-action="focus-work" class="${focus.mode==='work'?'active':''}">Concentrazione · 25 min</button><button data-action="focus-rest" class="${focus.mode==='rest'?'active':''}">Pausa · 5 min</button></div><div class="timer-ring"><div><div class="digits" id="timer-digits">${pad(Math.floor(focus.left/60))}:${pad(focus.left%60)}</div><small>${focus.mode==='work'?'Concentrazione':'Pausa'}</small></div></div><div class="timer-controls"><button class="primary-btn" data-action="focus-toggle" id="focus-toggle">${focus.running?'Pausa':'▶ Inizia'}</button><button class="plain-btn" data-action="focus-reset">↻ Ricomincia</button></div></section>
      <aside class="surface focus-tips"><div class="eyebrow">IL TUO PERCORSO</div><h3>Piccoli progressi</h3><div style="font-size:35px;font-weight:800;color:#745ad1">${doneToday}</div><p>Sessioni di concentrazione completate oggi.</p><div class="mini-table"><div><span>Minuti oggi</span><strong>${doneToday*25}</strong></div><div><span>Sessioni totali</span><strong>${state.sessions.length}</strong></div></div><h3 style="margin-top:28px">Il metodo Pomodoro</h3><ul><li>25 minuti su una sola attività.</li><li>5 minuti per staccare.</li><li>Ripeti con calma, al tuo ritmo.</li></ul><p>Il timer continua a contare se passi a un'altra schermata dell'app. Per un avviso a schermo bloccato, usa un timer nativo dell'iPad.</p></aside></div>`;
  }
  function renderSettings(){
    return `<div class="settings-grid"><section class="setting-card"><div class="eyebrow">BACKUP E PRIVACY</div><h3>Metti al sicuro i tuoi dati</h3><p>Le informazioni vengono salvate soltanto in questo browser sull'iPad. Non c'è account e non avviene alcuna sincronizzazione automatica. Esporta regolarmente una copia e conservala su File o iCloud Drive.</p><div class="setting-actions"><button class="primary-btn" data-action="export-backup">↓ Esporta backup</button><button class="light-btn" data-action="import-backup">↑ Importa backup</button></div></section>
      <section class="setting-card"><div class="eyebrow">NOTIFICHE</div><h3>Non perdere gli impegni</h3><p>Puoi attivare avvisi mentre UniStudio è aperta. Per ricevere promemoria anche con l'app chiusa, esporta lezioni, esami e scadenze nel Calendario Apple e abilita lì gli avvisi.</p><div class="setting-actions"><button class="primary-btn" data-action="request-notification">${state.notifications?'✓ Avvisi richiesti':'Abilita avvisi'}</button><button class="light-btn" data-action="export-ics">↓ Esporta calendario</button></div></section>
      <section class="setting-card"><div class="eyebrow">INSTALLAZIONE IPAD</div><h3>Come aggiungere l'app alla Home</h3><div class="instructions">Apri il link di UniStudio in <strong>Safari</strong> sull'iPad.<ol><li>Tocca <strong>Condividi</strong> (quadrato con freccia in alto).</li><li>Seleziona <strong>Aggiungi alla schermata Home</strong>.</li><li>Tocca <strong>Aggiungi</strong>.</li></ol>Ora vedrai UniStudio sulla Home, come un'app. Non serve l'App Store.</div></section>
      <section class="setting-card"><div class="eyebrow">PROMEMORIA IMPORTANTI</div><h3>Come funzionano i dati</h3><p>La modalità offline si attiva dopo la prima visita tramite HTTPS. Se cancelli i dati di Safari, potresti perdere appunti e impegni: conserva un backup. L'esportazione del calendario copre le prossime 12 settimane di lezioni.</p><div class="setting-actions"><button class="danger-btn" data-action="clear-data">Cancella tutti i dati</button></div></section></div>`;
  }
  function renderMore(){return `${head('Tutti gli strumenti')}<div class="more-links">${[['lessons','Lezioni e materie'],['exams','Esami'],['focus','Timer Focus'],['settings','Impostazioni e backup']].map(([slug,label])=>`<button data-page="${slug}">${label}<span>→</span></button>`).join('')}</div>`;}
  const RENDERS={home:renderHome,agenda:renderAgenda,lessons:renderLessons,tasks:renderTasks,exams:renderExams,notes:renderNotes,focus:renderFocus,settings:renderSettings,more:renderMore};
  const TITLES={home:'Panoramica',agenda:'La mia agenda',lessons:'Lezioni e materie',tasks:'I miei promemoria',exams:'I miei esami',notes:'I miei appunti',focus:'Sessione Focus',settings:'Impostazioni',more:'Tutti gli strumenti'};
  function render(){
    $('#top-date').textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    $('#page-title').textContent=TITLES[page];
    $('#app').innerHTML=RENDERS[page]();
    document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle(b.classList.contains('nav-item')?'active':'selected',b.dataset.page===page||(page==='more'&&b.dataset.page==='more')||(!['home','agenda','tasks','notes','more'].includes(page)&&b.dataset.page==='more')));
  }
  function navigate(next){page=RENDERS[next]?next:'home';render();window.scrollTo({top:0,behavior:'smooth'});}

    if(id==="v3-plan"){if(!f.topic.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(f.date))return;const a=plans(),old=a.find(x=>x.id===editingPlan);const x={id:old?.id||uid(),topic:f.topic.trim(),courseId:f.courseId,date:f.date,minutes:limit(f.minutes,1,720,30),done:old?.done||false};state.plansV3=old?a.map(y=>y.id===old.id?x:y):[...a,x];editingPlan="";}
    if(id==="v3-resource"){if(!f.title.trim())return;if(f.url&&!urlOK(f.url)){toast("Usa un indirizzo http o https valido");return;}const a=resources(),old=a.find(x=>x.id===editingResource);const x={id:old?.id||uid(),title:f.title.trim(),kind:f.kind,courseId:f.courseId,url:f.url?urlOK(f.url):"",note:f.note};state.resourcesV3=old?a.map(y=>y.id===old.id?x:y):[...a,x];editingResource="";}
    save();render();toast("Salvato");
  });
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-v3]");if(!b)return;const k=b.dataset.v3,id=b.dataset.id;
    if(k==="remove-avatar"||k==="remove-wall"){state.profileV2={...prefs(),[k==="remove-avatar"?"avatar":"wallPhoto"]:""};}
    if(k==="edit-plan")editingPlan=id;if(k==="cancel-plan")editingPlan="";
    if(k==="edit-resource")editingResource=id;if(k==="cancel-resource")editingResource="";
    if(k==="toggle-plan")state.plansV3=plans().map(x=>x.id===id?{...x,done:!x.done}:x);
    if(k==="delete-plan"){if(!confirm("Eliminare questo ripasso?"))return;state.plansV3=plans().filter(x=>x.id!==id);if(editingPlan===id)editingPlan="";}
    if(k==="delete-resource"){if(!confirm("Eliminare questa risorsa?"))return;state.resourcesV3=resources().filter(x=>x.id!==id);if(editingResource===id)editingResource="";}
    save();render();
  });
  document.addEventListener("change",async e=>{
    if(!["v3-avatar-upload","v3-wall-upload"].includes(e.target.id))return;
    const f=e.target.files?.[0],avatar=e.target.id==="v3-avatar-upload";if(!f)return;
    if(f.size>20000000){toast("Scegli una foto inferiore a 20 MB");return;}
    const u=URL.createObjectURL(f);
    try{
      const img=new Image();img.src=u;await img.decode();const max=avatar?320:900,ratio=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let data=c.toDataURL("image/jpeg",.75);if(!validImage(data))data=c.toDataURL("image/jpeg",.45);if(!validImage(data))throw Error("size");state.profileV2={...prefs(),[avatar?"avatar":"wallPhoto"]:data};save();render();toast("Immagine salvata");
    }catch{toast("Immagine non supportata: prova JPG o PNG");}finally{URL.revokeObjectURL(u);}
  });

  setInterval(focusTick,1000);
  setInterval(checkReminders,30000);
  render();checkReminders();
})();
</script>
