.u13-editor.u7-full .u13-sticky{border-radius:0}.u13-editor.u7-full .u13-desk{min-height:calc(100vh - 130px)}.u13-editor.u7-full .u13-paper-scroll{max-width:1100px;margin:auto}

@media(max-width:700px){.u13-header,.u13-toolbar{padding:8px;gap:5px}.u13-icon{width:40px;height:40px}.u13-header .u13-title{flex-basis:100%}.u13-toolbar>.u13-group{padding-right:4px}.u13-desk{padding:8px}.u13-sticky{position:static}.u7-full .u13-sticky{position:sticky;top:0}.u13-footer{font-size:11px}}
@media print{body:has(#u5-title) .u13-sticky,body:has(#u5-title) .u13-panel,body:has(#u5-title) .u13-footer{display:none!important}body:has(#u5-title) .u13-desk{padding:0;background:white}body:has(#u5-title) .u13-paper-scroll{overflow:visible;padding:0}body:has(#u5-title) .u13-paper{width:100%!important;box-shadow:none}}

<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigazione">
      <div class="brand"><div class="brand-icon">✦</div><div><strong>UniStudio</strong><small>Il tuo spazio di studio</small></div></div>

      <nav id="nav" class="nav">
        <button data-page="home" class="nav-item active"><span class="nav-ico">⌂</span> Panoramica</button>

        <button data-page="settings" class="nav-item"><span class="nav-ico">⚙</span> Impostazioni</button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div><span class="topbar-eyebrow" id="top-date"></span><h1 id="page-title">Panoramica</h1></div>
        <div class="header-right"><span class="privacy-chip">◉ Solo sul tuo iPad</span><button class="primary-btn header-add" data-action="add-task"><span>＋</span> Nuovo promemoria</button></div>

      <main id="app" tabindex="-1"></main>

  <dialog id="editor-dialog"><div class="dialog-inner"><header><div><div class="eyebrow">UNISTUDIO</div><h2 id="dialog-title">Nuovo elemento</h2></div><button class="icon-btn" id="close-dialog" type="button" aria-label="Chiudi">✕</button></header><form id="editor-form"></form></div></dialog>
  <input type="file" accept="application/json,.json" id="import-file" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>(async () => {
  'use strict';
  const KEY = 'unistudio_data_v1';
  const DAYS = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const SHORT_DAYS = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  const COLORS = ['#8667dc','#e08d95','#64a7a0','#e3a466','#7594d7','#af86c6'];
  const $ = s => document.querySelector(s);
  const emptyState = () => ({courses:[],lessons:[],tasks:[],exams:[],notes:[],sessions:[],notifications:false});

  // Paper Ultra: preserve the v1 key, add a full IndexedDB copy and visible save status.
  let db12=null, revision12=0, savedRevision12=0, pending12=0, saveError12='', lastLocal12=0;
  const readLocal12=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}};
  const marker12=()=>{try{return Number(localStorage.getItem(KEY+'_idb_revision12'))||0}catch{return 0}};
  const mark12=v=>{try{localStorage.setItem(KEY+'_idb_revision12',String(v))}catch{}};
  function open12(){return new Promise(resolve=>{if(!globalThis.indexedDB)return resolve(null);let ended=false;const finish=v=>{if(ended){v?.close?.();return}ended=true;clearTimeout(timer);resolve(v)};const timer=setTimeout(()=>finish(null),3500);try{const req=indexedDB.open('UniStudioState12',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state')};req.onsuccess=()=>finish(req.result);req.onerror=req.onblocked=()=>finish(null)}catch{finish(null)}})}
  function readDB12(db){return new Promise(resolve=>{if(!db)return resolve(null);let done=false;const finish=v=>{if(!done){done=true;clearTimeout(timer);resolve(v)}};const timer=setTimeout(()=>finish(null),3500);try{const req=db.transaction('state','readonly').objectStore('state').get('main');req.onsuccess=()=>finish(req.result||null);req.onerror=()=>finish(null)}catch{finish(null)}})}
  function storageStatus12(){const el=document.getElementById('u12-save-state');if(!el)return;el.textContent=saveError12?'⚠ '+saveError12:pending12?'Salvataggio in corso…':db12?'Archivio locale · '+(savedRevision12?'salvato':'pronto'):'Archivio locale · modalità compatibilità';el.dataset.warning=saveError12?'yes':'no';const n=document.getElementById('u5-status');if(n)n.textContent=el.textContent}
  function persistState12(){
    if(Math.max(Number(readLocal12()?.paper12Revision)||0,marker12())>revision12){saveError12='Dati più recenti in un’altra scheda: chiudi questa scheda senza ulteriori modifiche';storageStatus12();throw Error('Stale tab')}
    const rev=Math.max(Date.now(),revision12+1);revision12=rev;state.paper12Revision=rev;
    let local=false;
    try{const str=JSON.stringify(state);if(str.length<=1800000||!db12){localStorage.setItem(KEY,str);local=true;lastLocal12=rev}}catch{}
    if(!db12){if(!local){saveError12='Spazio non disponibile: esporta subito un backup';storageStatus12();throw Error('Storage unavailable')}saveError12='';savedRevision12=rev;storageStatus12();return}
    try{
      const tx=db12.transaction('state','readwrite');
      tx.objectStore('state').put({revision:rev,data:state},'main');
      pending12++;saveError12='';storageStatus12();
      tx.oncomplete=()=>{pending12--;savedRevision12=Math.max(savedRevision12,rev);mark12(savedRevision12);if(savedRevision12>=revision12)saveError12='';storageStatus12()};
      tx.onabort=()=>{pending12--;if(rev>=revision12&&local){savedRevision12=Math.max(savedRevision12,rev)}if(rev>=revision12&&!local){saveError12='Ultima modifica NON salvata: esporta un backup prima di chiudere';toast(saveError12)}storageStatus12()};
      tx.onerror=()=>{};
    }catch(e){if(!local){saveError12='Ultima modifica NON salvata: esporta un backup';storageStatus12();throw e}savedRevision12=rev;storageStatus12()}
  }
  let state;
  const previous12=readLocal12();
  lastLocal12=Number(previous12?.paper12Revision)||0;
  db12=await open12();
  const stored12=await readDB12(db12);
  const diskRev12=Number(stored12?.revision)||0;
  if(marker12()>Math.max(diskRev12,lastLocal12)){
    const app=document.getElementById('app');
    if(app){app.textContent='Archivio non ancora accessibile. Riapri UniStudio senza cancellare i dati, oppure verifica lo spazio del dispositivo.';const b=document.createElement('button');b.textContent='Riprova';b.onclick=()=>location.reload();app.append(b)}
    return;
  }
  const selected12=stored12?.data&&diskRev12>=lastLocal12?stored12.data:previous12;
  state=selected12&&typeof selected12==='object'?{...emptyState(),...selected12}:emptyState();
  for(const key of ['courses','lessons','tasks','exams','notes','sessions'])if(!Array.isArray(state[key]))state[key]=[];
  revision12=Math.max(diskRev12,lastLocal12);
  savedRevision12=revision12;
  if(db12&&previous12&&(diskRev12<lastLocal12||!stored12)){try{persistState12()}catch{}}
  window.addEventListener('beforeunload',e=>{if(pending12||saveError12){e.preventDefault();e.returnValue=''}});
  window.addEventListener('storage',e=>{if((e.key===KEY||e.key===KEY+'_idb_revision12')&&Math.max(Number(readLocal12()?.paper12Revision)||0,marker12())>revision12){saveError12='Dati aggiornati in un’altra scheda: ricarica prima di modificare';storageStatus12()}});
  let page = 'home', weekOffset = 0, taskFilter = 'all', noteSearch = '';
  let focus = {mode:'work',left:25*60,running:false,endAt:0};
  let toastTimeout;
  const uid = () => (globalThis.crypto?.randomUUID?.() || `id_${Date.now()}_${Math.random().toString(36).slice(2)}`);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const attr = esc;
  const pad = n => String(n).padStart(2,'0');
  const localDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const atDate = s => {const [y,m,d] = (s || localDate(new Date())).split('-').map(Number);return new Date(y,m-1,d)};
  const plusDays = (date,n) => {const d= new Date(date);d.setDate(d.getDate()+n);return d;};
  const today = () => localDate(new Date());
  const fmtDate = (s,options={day:'numeric',month:'short'}) => s ? atDate(s).toLocaleDateString('it-IT',options) : 'Senza data';
  const diffDays = s => Math.round((atDate(s).getTime()-atDate(today()).getTime())/86400000);
  const dayName = n => DAYS[Number(n)] || DAYS[0];
  const course = id => state.courses.find(c=>c.id===id);
  const courseName = id => course(id)?.name || 'Generale';
  const courseColor = id => course(id)?.color || COLORS[0];
  const safeColor = c => /^#[a-fA-F0-9]{6}$/.test(c||'') ? c : COLORS[0];
  const sortDateTime = (a,b) => `${a.date||''} ${a.time||''}`.localeCompare(`${b.date||''} ${b.time||''}`);
  const save = () => {try {persistState12();} catch {toast('Spazio esaurito. Esporta un backup e libera spazio.');}};
  function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),3100);}
  function empty(message, action='', label='Aggiungi ora'){
    return `<div class="empty"><span class="empty-icon">✦</span>${esc(message)}${action?`<div><button class="light-btn small-btn" data-action="${action}">＋ ${esc(label)}</button></div>`:''}</div>`;
  }
  function head(title,action='',label='Aggiungi',description=''){
    return `<div class="section-heading"><div><h2>${title}</h2>${description?`<p>${description}</p>`:''}</div>${action?`<button class="light-btn small-btn" data-action="${action}">＋ ${label}</button>`:''}</div>`;
  }
  function taskCount(){return state.tasks.filter(t=>!t.done).length;}
  function nextExam(){return [...state.exams].filter(e=>e.date>=today()&&!e.grade).sort(sortDateTime)[0];}
  function eventsOf(date){
    const d=atDate(date),wd=d.getDay();
    const ev = [];
    for(const l of state.lessons) if(Number(l.weekday)===wd){ev.push({kind:'lesson',id:l.id,title:courseName(l.courseId),date,time:l.start||'00:00',end:l.end||'',detail:l.room||'',color:courseColor(l.courseId)});}
    for(const t of state.tasks) if(t.date===date) ev.push({kind:'task',id:t.id,title:t.title,date,time:t.time||'09:00',detail:t.done?'Completato':'Da fare',done:t.done});
    for(const e of state.exams) if(e.date===date) ev.push({kind:'exam',id:e.id,title:e.title,date,time:e.time||'09:00',detail:e.room||'Esame'});
    return ev.sort((a,b)=>a.time.localeCompare(b.time));
  }
  function stat(label,value,icon,sub){return `<div class="stat-card"><div class="stat-label"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><div class="stat-sub">${sub}</div></div>`;}
  function eventRow(e){return `<div class="item-row"><span class="time-pill">${esc(e.time)}${e.end?`<br><span style="font-weight:500;font-size:9px">${esc(e.end)}</span>`:''}</span><div class="item-main"><div class="item-title">${esc(e.title)}</div><div class="item-sub">${esc(e.detail|| ({lesson:'Lezione',exam:'Esame',task:'Promemoria'}[e.kind]))}</div></div><span class="chip">${{lesson:'Lezione',exam:'Esame',task:'Da fare'}[e.kind]}</span></div>`;}
  function hero(){
    const h=new Date().getHours();const greeting=h<12?'Buongiorno':h<18?'Buon pomeriggio':'Buonasera';
    const active=state.courses.length>0;
    return `<section class="hero"><div><div class="hero-kicker">IL TUO SPAZIO, IL TUO RITMO</div><h2>${greeting}! ${active?'Pronta a dare il meglio?':'Benvenuta in UniStudio.'}</h2><p>${active?'Le tue lezioni, i tuoi traguardi e tutti i piccoli passi verso la laurea.':'Inizia aggiungendo le tue materie: il resto sarà più semplice, un giorno alla volta.'}</p><button class="plain-btn" style="margin-top:18px;background:white;color:#6f53c9" data-action="${active?'add-task':'add-course'}">＋ ${active?'Organizza una cosa da fare':'Aggiungi la prima materia'}</button></div><div class="hero-art" aria-hidden="true">✎</div></section>`;
  }
  function renderHome(){
    const todayEvents=eventsOf(today());
    const pending=[...state.tasks].filter(t=>!t.done).sort(sortDateTime).slice(0,5);
    const upcoming=nextExam();
    const weekLessons=state.lessons.length;
    return `${hero()}<div class="stats-grid">${stat('Materie',state.courses.length,'▤','In questo semestre')}${stat('Lezioni / settimana',weekLessons,'▦','Orario ricorrente')}${stat('Da completare',taskCount(),'☑','Promemoria attivi')}${stat('Esami in arrivo',state.exams.filter(e=>e.date>=today()&&!e.grade).length,'✧','Ancora da sostenere')}</div>
      <div class="two-col"><section>${head('La giornata di oggi','add-lesson','Nuova lezione')}<div class="surface surface-pad">${todayEvents.length?todayEvents.map(eventRow).join(''):empty('Nessuna lezione o scadenza oggi. Goditi il tempo per ripassare!', 'add-task','Crea promemoria')}</div></section>
      <section>${head('Prossimi impegni','add-task','Aggiungi')}<div class="surface surface-pad">${pending.length?pending.map(t=>`<div class="item-row"><button class="check-btn" aria-label="Segna come completato" data-action="toggle-task" data-id="${attr(t.id)}"></button><div class="item-main"><div class="item-title">${esc(t.title)}</div><div class="item-sub">${esc(courseName(t.courseId))} · ${fmtDate(t.date)}</div></div>${t.date&&diffDays(t.date)<0?'<span class="status-chip urgent">Scaduto</span>':''}</div>`).join(''):empty('Nessuna attività in sospeso.','add-task','Crea promemoria')}</div></section></div>
      <div class="two-col"><section>${head('Il prossimo esame','add-exam','Nuovo esame')}<div class="surface surface-pad">${upcoming?`<div class="item-row" style="border:0"><div class="time-pill">✧</div><div class="item-main"><div class="item-title">${esc(upcoming.title)}</div><div class="item-sub">${fmtDate(upcoming.date,{day:'numeric',month:'long',year:'numeric'})}${upcoming.time?' alle '+esc(upcoming.time):''}</div></div><span class="status-chip ${diffDays(upcoming.date)<7?'urgent':''}">${diffDays(upcoming.date)===0?'Oggi':`Tra ${diffDays(upcoming.date)} giorni`}</span></div>`:empty('Nessun esame programmato.','add-exam','Aggiungi esame')}</div></section>
      <section>${head('Il tuo tempo di studio','go-focus','Apri Focus')}<div class="surface surface-pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="eyebrow">POMODORO</div><div style="font-size:27px;font-weight:800;margin:12px 0 4px">25:00</div><div class="item-sub">Concentrati, poi una pausa</div></div><button class="light-btn" data-action="go-focus">Inizia →</button></div></div></section></div>`;
  }
  function renderAgenda(){
    const now=atDate(today()),monday=plusDays(now,-((now.getDay()+6)%7)+7*weekOffset);
    const span=Array.from({length:7},(_,i)=>plusDays(monday,i));
    const title=`${fmtDate(localDate(span[0]),{day:'numeric',month:'short'})} – ${fmtDate(localDate(span[6]),{day:'numeric',month:'short',year:'numeric'})}`;
    return `<div class="toolbar"><div class="toolbar-left"><button class="plain-btn small-btn" data-action="week-back">←</button><button class="plain-btn small-btn" data-action="week-today">Oggi</button><button class="plain-btn small-btn" data-action="week-next">→</button><strong style="font-size:13px;margin-left:5px">${title}</strong></div><div class="toolbar-right"><button class="light-btn small-btn" data-action="export-ics">↓ Aggiungi a Calendario</button><button class="primary-btn small-btn" data-action="add-lesson">＋ Lezione</button></div></div>
      <div class="weekday-grid">${span.map(d=>{const date=localDate(d),ev=eventsOf(date);return `<div class="day-column ${date===today()?'today':''}"><div class="day-heading"><span>${SHORT_DAYS[d.getDay()]}</span><strong>${d.getDate()}</strong></div>${ev.length?ev.map(e=>`<button class="calendar-event ${e.kind==='task'?'task':e.kind==='exam'?'exam':''}" style="--event:${e.color||''};--event-bg:${e.color?e.color+'18':''}" data-action="edit-${e.kind==='lesson'?'lesson':e.kind==='exam'?'exam':'task'}" data-id="${attr(e.id)}"><small>${esc(e.time)}</small><strong>${esc(e.title)}</strong></button>`).join(''):'<div class="no-day">—</div>'}</div>`}).join('')}</div>
      ${head('Legenda')}<div class="surface surface-pad" style="display:flex;gap:13px;flex-wrap:wrap"><span class="chip">Lezioni</span><span class="status-chip" style="background:#fff8ed;color:#b58148">Promemoria</span><span class="status-chip urgent">Esami</span><span class="item-sub">Tocca un evento per modificarlo. Le lezioni si ripetono ogni settimana.</span></div>`;
  }
  function renderLessons(){
    const sorted=[...state.lessons].sort((a,b)=>((Number(a.weekday)+6)%7)-((Number(b.weekday)+6)%7)||String(a.start).localeCompare(String(b.start)));
    return `<div class="toolbar"><div class="toolbar-left"><span class="muted" style="font-size:12px">Organizza materie e orario settimanale</span></div><div class="toolbar-right"><button class="light-btn" data-action="add-course">＋ Materia</button><button class="primary-btn" data-action="add-lesson">＋ Lezione</button></div></div>
      ${head('Le mie materie')}<div class="cards-grid">${state.courses.length?state.courses.map(c=>`<div class="course-card" style="--course:${safeColor(c.color)}"><h3>${esc(c.name)}</h3><p>${c.professor?'Docente: '+esc(c.professor):'Aggiungi un docente dalle impostazioni della materia'}</p><div class="card-bottom"><span class="small-muted">${state.lessons.filter(l=>l.courseId===c.id).length} lezioni</span><div class="action-cluster"><button class="text-btn" data-action="edit-course" data-id="${attr(c.id)}">Modifica</button><button class="text-btn danger" data-action="delete-course" data-id="${attr(c.id)}">Elimina</button></div></div></div>`).join(''):empty('Non hai ancora aggiunto materie.','add-course','Crea la prima materia')}</div>
      ${head('Orario settimanale')}<div class="surface surface-pad">${sorted.length?sorted.map(l=>`<div class="item-row"><span class="time-pill">${SHORT_DAYS[Number(l.weekday)]}<br>${esc(l.start)}</span><div class="item-main"><div class="item-title">${esc(courseName(l.courseId))}</div><div class="item-sub">${esc(l.start)}–${esc(l.end)}${l.room?' · '+esc(l.room):''}</div></div><div class="action-cluster"><button class="text-btn" data-action="edit-lesson" data-id="${attr(l.id)}">Modifica</button><button class="text-btn danger" data-action="delete-lesson" data-id="${attr(l.id)}">Elimina</button></div></div>`).join(''):empty('Aggiungi le lezioni che si ripetono ogni settimana.','add-lesson','Aggiungi lezione')}</div>`;
  }
  function renderTasks(){

  function saveForm(event){
    event.preventDefault();
    const f=event.currentTarget,kind=f.dataset.kind,id=f.dataset.id,fd=new FormData(f);const value=k=>String(fd.get(k)||'').trim();
    const target={course:'courses',lesson:'lessons',task:'tasks',exam:'exams',note:'notes'}[kind];
    const existing=state[target].find(x=>x.id===id);const item={...existing,id:id||uid()};
    if(kind==='course'){item.name=value('name');item.professor=value('professor');item.color=safeColor(value('color'));}
    if(kind==='lesson'){item.courseId=value('courseId');item.weekday=Number(value('weekday'));item.start=value('start');item.end=value('end');item.room=value('room');if(item.end<=item.start){toast('L’orario di fine deve essere dopo l’inizio.');return;}}
    if(kind==='task'){item.title=value('title');item.date=value('date');item.time=value('time');item.courseId=value('courseId');item.priority=value('priority');item.description=value('description');if(!existing)item.done=false;}
    if(kind==='exam'){item.title=value('title');item.courseId=value('courseId');item.date=value('date');item.time=value('time');item.room=value('room');item.credits=Math.max(1,Math.min(40,Number(value('credits'))||6));item.grade=value('grade')?Number(value('grade')):null;}
    if(kind==='note'){item.title=value('title');item.courseId=value('courseId');item.content=value('content');item.updated=Date.now();}
    if((kind==='course'&&!item.name)||(['task','exam','note'].includes(kind)&&!item.title))return;
    if(existing)Object.assign(existing,item);else state[target].push(item);
    save();$('#editor-dialog').close();render();toast(existing?'Modifiche salvate':'Aggiunto con successo');
  }

  function icsEscape(s){return String(s??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}

    return ['BEGIN:VEVENT',`UID:${id}@unistudio.local`,`DTSTAMP:${icsStamp()}`,`DTSTART:${icsDate(date,time)}`,`DTEND:${icsDate(date,ending)}`,`SUMMARY:${icsEscape(title)}`,`LOCATION:${icsEscape(location)}`,`DESCRIPTION:${icsEscape(description)}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEscape(title)}`,`TRIGGER:-PT${lead}M`,'END:VALARM','END:VEVENT'].join('\r\n');
  }
  function exportICS(){
    const entries=[],start=atDate(today());
    for(let n=0;n<84;n++){
      const date=localDate(plusDays(start,n));
      for(const l of state.lessons)if(Number(l.weekday)===atDate(date).getDay())entries.push(icsEvent(`${l.id}-${date}`,`Lezione: ${courseName(l.courseId)}`,date,l.start,l.end,l.room,'Creato da UniStudio'));
    }
    for(const e of state.exams)if(e.date>=today()&&!e.grade)entries.push(icsEvent(e.id,`Esame: ${e.title}`,e.date,e.time||'09:00',null,e.room,'Creato da UniStudio',60));
    for(const t of state.tasks)if(t.date>=today()&&!t.done)entries.push(icsEvent(t.id,`Promemoria: ${t.title}`,t.date,t.time||'09:00',null,'',t.description,30));
    if(!entries.length){toast('Aggiungi prima una lezione, un esame o una scadenza.');return;}
    const text=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UniStudio//Planner iPad IT//IT','CALSCALE:GREGORIAN','METHOD:PUBLISH',...entries,'END:VCALENDAR'].join('\r\n')+'\r\n';

function buildKit(t){const p=pieces(t),stop=new Set(['della','delle','dello','degli','questo','questa','quello','quindi','anche','come','sono','dalla','nelle','nella','essere','viene','stato','hanno','dopo','prima','parte','quale','quali','delle']);const words=s=>s.toLowerCase().match(/\p{L}{5,}/gu)?.filter(w=>!stop.has(w))||[];const freq=new Map;for(const s of p)for(const w of words(s))freq.set(w,(freq.get(w)||0)+1);const ranked=p.map((s,i)=>({s,i,score:words(s).reduce((a,w)=>a+(freq.get(w)||0),0)/Math.sqrt(s.length)})).sort((a,b)=>b.score-a.score).slice(0,10).sort((a,b)=>a.i-b.i).map(x=>x.s);const cards=ranked.map(s=>{const term=words(s).sort((a,b)=>(freq.get(b)||0)-(freq.get(a)||0))[0];if(!term)return null;const re=new RegExp('\\b'+term+'\\b','iu');const match=s.match(re);return match?{question:s.replace(re,'[…]'),answer:match[0]}:null}).filter(Boolean);return {summary:ranked.join('\n\n'),cards,keywords:[...freq].sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0])}}

function calculate(s){const tokens=s.replace(/,/g,'.').match(/\d+(?:\.\d+)?(?:e[+-]?\d+)?|\.\d+|sqrt|sin|cos|tan|log|ln|pi|[()+*/^%-]/gi)||[];if(tokens.join('')!==s.replace(/[\s]/g,'').replace(/,/g,'.'))throw Error('Espressione non valida');let i=0;const take=()=>tokens[i++],peek=()=>tokens[i];function primary(){const t=take();if(t==='('){const x=expr();if(take()!==')')throw Error('Parentesi');return x}if(t==='pi')return Math.PI;if(['sqrt','sin','cos','tan','log','ln'].includes(t)){if(take()!=='(')throw Error('Usa parentesi');const a=expr();if(take()!==')')throw Error('Parentesi');return ({sqrt:Math.sqrt,sin:Math.sin,cos:Math.cos,tan:Math.tan,log:Math.log10,ln:Math.log})[t](a)}if(t===undefined||!Number.isFinite(Number(t)))throw Error('Numero atteso');return Number(t)}function power(){let x=primary();if(peek()==='^'){take();x=x**unary()}return x}function unary(){if(peek()==='-'){take();return -unary()}if(peek()==='+'){take();return unary()}return power()}function term(){let x=unary();while(['*','/','%'].includes(peek())){const t=take(),y=unary();x=t==='*'?x*y:t==='/'?x/y:x%y}return x}function expr(){let x=term();while(['+','-'].includes(peek())){const t=take(),y=term();x=t==='+'?x+y:x-y}return x}if(s.length>240)throw Error('Espressione troppo lunga');const r=expr();if(i!==tokens.length||!Number.isFinite(r))throw Error('Risultato non definito');return r}
